name: Build and release CoCoPress

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Prepare bundled Python
        run: npm run setup-python

      - name: Build
        run: npm run dist:${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cocopress-${{ matrix.platform }}
          path: dist/**/*
          if-no-files-found: error

  release:
    needs: build
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Verify Windows assets
        shell: bash
        run: |
          test -n "$(find cocopress-win -type f \( -name '*.exe' -o -name '*.blockmap' \) -print -quit)"

      - name: Generate checksums
        shell: bash
        run: |
          find cocopress-win cocopress-mac cocopress-linux -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) \
            -exec sha256sum {} + 2>/dev/null | sed 's#  cocopress-[^/]*/#  #' > SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            SHA256SUMS.txt
            cocopress-win/**/*
            cocopress-mac/**/*
            cocopress-linux/**/*
